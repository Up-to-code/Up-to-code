<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahmed Mansour — Languages</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#1f2328;--muted:#656d76}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif}main{max-width:800px;margin:32px auto;padding:0 24px}h1{font-size:22px;font-weight:600;margin:0 0 20px}.bar{display:flex;height:10px;overflow:hidden;border-radius:5px;margin-bottom:20px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;list-style:none;padding:0;margin:0}.legend li{display:flex;align-items:center;gap:10px}.legend i{width:8px;height:8px;border-radius:50%;flex:none}.legend strong{font-weight:500}.legend span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}footer{margin-top:20px;font-size:12px;color:var(--muted)}a{color:inherit;text-underline-offset:3px}a:focus-visible{outline:2px solid currentColor;outline-offset:4px}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#8b949e}}@media(max-width:480px){main{margin-block:24px}.legend{grid-template-columns:1fr}}
</style>
</head>
<body><main><h1>Languages</h1><div class="bar" role="img" aria-label="Share of source bytes"></div><ul class="legend"></ul><footer></footer></main>
<script>
const profile=__PROFILE_DATA__;
const languages=profile.languages.filter(row=>Number.isFinite(row.bytes)&&row.bytes>0).sort((a,b)=>b.bytes-a.bytes);
const total=languages.reduce((sum,row)=>sum+row.bytes,0);
const rows=languages.slice(0,6);
if(languages.length>6)rows.push({name:'Other',bytes:languages.slice(6).reduce((sum,row)=>sum+row.bytes,0),color:'#8b949e'});
if(total)for(const row of rows){
 const share=row.bytes/total*100;
 const segment=document.createElement('span');segment.style.width=share+'%';segment.style.backgroundColor=row.color;document.querySelector('.bar').append(segment);
 const item=document.createElement('li'),dot=document.createElement('i'),name=document.createElement('strong'),value=document.createElement('span');
 dot.style.backgroundColor=row.color;name.textContent=row.name;value.textContent=share.toFixed(2)+'%';item.append(dot,name,value);document.querySelector('.legend').append(item);
}
const footer=document.querySelector('footer');footer.append(document.createTextNode('Source bytes · '+profile.languageRepositoryCount+' repositories · '+profile.updatedLabel+' · '));const link=document.createElement('a');link.href='./languages.json';link.textContent='Full data';footer.append(link);
</script></body></html>

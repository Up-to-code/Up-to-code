<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code behind the products</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        --canvas: #ffffff;
        --primary: #1d1d1f;
        --secondary: #6e6e73;
        --hairline: rgba(0, 0, 0, 0.09);
        --icon-surface: rgba(0, 0, 0, 0.04);
        background: var(--canvas);
        color: var(--primary);
      }

      body[data-theme="dark"] {
        --canvas: #0d1117;
        --primary: #f5f5f7;
        --secondary: #8e8e93;
        --hairline: rgba(255, 255, 255, 0.12);
        --icon-surface: rgba(255, 255, 255, 0.07);
      }

      main {
        width: 1920px;
        height: 720px;
        padding: 42px 56px 28px;
        opacity: 0;
        transform: translateY(10px);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 34px;
      }

      h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 640;
        letter-spacing: -3.6px;
        line-height: 1;
      }

      .summary {
        display: flex;
        gap: 52px;
      }

      .metric {
        display: grid;
        grid-template-columns: 38px auto;
        grid-template-rows: auto auto;
        column-gap: 12px;
        align-items: center;
      }

      .metric-icon {
        display: grid;
        grid-row: 1 / 3;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--icon-surface);
        color: var(--secondary);
      }

      .metric-icon svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .metric strong {
        font-size: 30px;
        font-weight: 620;
        letter-spacing: -1px;
        line-height: 1;
      }

      .metric-label,
      .updated {
        color: var(--secondary);
        font-size: 16px;
        font-weight: 450;
        letter-spacing: -0.1px;
      }

      .bar-shell {
        height: 24px;
        overflow: hidden;
        border-radius: 12px;
        background: var(--hairline);
      }

      .bar {
        display: flex;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
      }

      .bar span { flex: none; height: 100%; }

      .legend {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-flow: column;
        grid-template-rows: repeat(5, 1fr);
        column-gap: 58px;
        height: 430px;
        margin: 26px 0 0;
        padding: 0;
        list-style: none;
      }

      .language {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 10px;
        min-width: 0;
        border-bottom: 1px solid var(--hairline);
        opacity: 0;
        transform: translateY(7px);
      }

      .language:nth-child(5n) { border-bottom: 0; }

      .language-icon {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid color-mix(in srgb, var(--language-color) 55%, transparent);
        border-radius: 9px;
        color: var(--language-color);
        font-size: 10px;
        font-weight: 720;
        letter-spacing: -0.4px;
        line-height: 1;
      }

      .name {
        overflow: hidden;
        font-size: 18px;
        font-weight: 540;
        letter-spacing: -0.2px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .percentage {
        color: var(--secondary);
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.15px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
      }

      .updated { margin: 0; }

      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #30d158;
        box-shadow: 0 0 0 5px rgba(48, 209, 88, 0.12);
      }

      @media (prefers-reduced-motion: reduce) {
        main, .language { opacity: 1; transform: none; }
        .bar { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Code behind the products.</h1>
        <div class="summary">
          <div class="metric">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 1 4 16.5v-11Z"/><path d="M7 3v16M4 16.5A2.5 2.5 0 0 1 6.5 14H19"/></svg>
            </span>
            <strong id="repository-count"></strong>
            <span class="metric-label">public repositories</span>
          </div>
          <div class="metric">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
            </span>
            <strong id="language-count"></strong>
            <span class="metric-label">languages detected</span>
          </div>
        </div>
      </header>

      <div class="bar-shell"><div class="bar" id="bar"></div></div>
      <ol class="legend" id="legend"></ol>

      <footer>
        <p class="updated" id="updated"></p>
        <span class="pulse" aria-hidden="true"></span>
      </footer>
    </main>

    <script>
      const profile = {"owner":"Up-to-code","updatedAt":"2026-09-01","updatedLabel":"Sep 1, 2026","repositoryCount":104,"languageRepositoryCount":80,"languages":[{"name":"TypeScript","shortName":"TS","bytes":5663641,"percentage":76.75116289312226,"label":"76.75%","color":"#3178c6"},{"name":"C++","shortName":"C++","bytes":613909,"percentage":8.319423787728386,"label":"8.32%","color":"#f34b7d"},{"name":"JavaScript","shortName":"JS","bytes":487268,"percentage":6.603240855238863,"label":"6.60%","color":"#f1e05a"},{"name":"CSS","shortName":"CS","bytes":472599,"percentage":6.404453042155511,"label":"6.40%","color":"#663399"},{"name":"HTML","shortName":"HT","bytes":49066,"percentage":0.6649207742005427,"label":"0.66%","color":"#e34c26"},{"name":"SCSS","shortName":"SC","bytes":37588,"percentage":0.5093759846054294,"label":"0.51%","color":"#c6538c"},{"name":"CMake","shortName":"CM","bytes":15035,"percentage":0.20374768353045203,"label":"0.20%","color":"#da3434"},{"name":"Python","shortName":"PY","bytes":12594,"percentage":0.1706683289911881,"label":"0.17%","color":"#3572a5"},{"name":"Astro","shortName":"AS","bytes":6429,"percentage":0.08712297023061365,"label":"0.09%","color":"#ff5a03"},{"name":"Kotlin","shortName":"KO","bytes":4198,"percentage":0.0568894429970627,"label":"0.06%","color":"#a97bff"},{"name":"Shell","shortName":"SH","bytes":2971,"percentage":0.04026168059653961,"label":"0.04%","color":"#89e051"},{"name":"Go","shortName":"GO","bytes":2870,"percentage":0.03889297317807764,"label":"0.04%","color":"#00add8"},{"name":"Ruby","shortName":"RU","bytes":2522,"percentage":0.034177030785753244,"label":"0.03%","color":"#701516"},{"name":"Swift","shortName":"SW","bytes":2275,"percentage":0.03082979581189081,"label":"0.03%","color":"#f05138"},{"name":"Makefile","shortName":"MK","bytes":1973,"percentage":0.02673722511510355,"label":"0.03%","color":"#427819"},{"name":"Dart","shortName":"DA","bytes":1962,"percentage":0.026588157970518587,"label":"0.03%","color":"#00b4ab"},{"name":"Java","shortName":"JA","bytes":900,"percentage":0.012196402738769992,"label":"0.01%","color":"#b07219"},{"name":"PowerShell","shortName":"PS","bytes":852,"percentage":0.011545927926035593,"label":"0.01%","color":"#012456"},{"name":"Dockerfile","shortName":"DK","bytes":471,"percentage":0.006382784099956296,"label":"\u003c0.01%","color":"#384d54"},{"name":"C","shortName":"C","bytes":102,"percentage":0.0013822589770605992,"label":"\u003c0.01%","color":"#555555"}]};
      const main = document.querySelector("main");
      const bar = document.querySelector("#bar");
      const legend = document.querySelector("#legend");

      document.querySelector("#repository-count").textContent = profile.repositoryCount;
      document.querySelector("#language-count").textContent = profile.languages.length;
      document.querySelector("#updated").textContent = `Languages measured across ${profile.languageRepositoryCount} original repositories · ${profile.updatedLabel}`;

      for (const language of profile.languages) {
        const segment = document.createElement("span");
        segment.style.width = `${language.percentage}%`;
        segment.style.background = language.color;
        bar.append(segment);

        const item = document.createElement("li");
        item.className = "language";
        item.style.setProperty("--language-color", language.color);
        item.innerHTML = `<span class="language-icon">${language.shortName}</span><span class="name">${language.name}</span><span class="percentage">${language.label}</span>`;
        legend.append(item);
      }

      const clamp = (value) => Math.max(0, Math.min(1, value));
      const ease = (value) => 1 - Math.pow(1 - clamp(value), 3);

      window.renderFrame = (progress, theme = "light") => {
        document.body.dataset.theme = theme;
        const intro = ease(progress / 0.22);
        main.style.opacity = intro;
        main.style.transform = `translateY(${10 * (1 - intro)}px)`;

        const barProgress = ease((progress - 0.06) / 0.46);
        bar.style.width = `${barProgress * 100}%`;

        [...legend.children].forEach((item, index) => {
          const itemProgress = ease((progress - 0.18 - index * 0.02) / 0.34);
          item.style.opacity = itemProgress;
          item.style.transform = `translateY(${7 * (1 - itemProgress)}px)`;
        });
      };

      if (!window.__PROFILE_CAPTURE__) {
        const startedAt = performance.now();
        const animate = (now) => {
          const progress = Math.min(1, (now - startedAt) / 1400);
          window.renderFrame(progress, matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>

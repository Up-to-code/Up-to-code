      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        --canvas: #ffffff;
        --primary: #111827;
        --secondary: #4b5563;
        --hairline: rgba(17, 24, 39, 0.12);
        --icon-surface: rgba(17, 24, 39, 0.06);
        background: var(--canvas);
        color: var(--primary);
      }

      body[data-theme="dark"] {
        --canvas: #0b1020;
        --primary: #f3f4f6;
        --secondary: #cbd5e1;
        --hairline: rgba(255, 255, 255, 0.14);
        --icon-surface: rgba(255, 255, 255, 0.08);
      }

      main {
        width: 1920px;
        height: 720px;
        padding: 32px 56px 18px;
        opacity: 0;
        transform: translateY(10px);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -2.8px;
        line-height: 1;
      }

      .summary {
        display: flex;
        gap: 18px;
      }

      .metric {
        display: grid;
        grid-template-columns: 38px auto;
        grid-template-rows: auto auto;
        column-gap: 12px;
        align-items: center;
      }

      .metric-icon {
        display: grid;
        grid-row: 1 / 3;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--icon-surface);
        color: var(--secondary);
      }

      .metric-icon svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .metric strong {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.9px;
        line-height: 1;
      }

      .metric-label,
      .updated {
        color: var(--secondary);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.1px;
      }

      .bar-shell {
        height: 22px;
        overflow: hidden;
        border-radius: 12px;
        background: var(--hairline);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .bar {
        display: flex;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
      }

      .bar span { flex: none; height: 100%; }

      .legend {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-flow: column;
        grid-template-rows: repeat(3, 1fr);
        column-gap: 22px;
        row-gap: 14px;
        height: 220px;
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
      }

      .language {
        display: grid;
        grid-template-columns: 20px 1fr auto;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--hairline);
        opacity: 0;
        transform: translateY(7px);
      }

      .language:nth-child(5n) { border-bottom: 0; }

      .language-icon {
        display: block;
        width: 18px;
        height: 18px;
        object-fit: contain;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.15));
      }

      .name {
        overflow: hidden;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .percentage {
        color: var(--secondary);
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.1px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
      }

      .updated { margin: 0; }

      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.18);
      }

      @media (prefers-reduced-motion: reduce) {
        main, .language { opacity: 1; transform: none; }
        .bar { width: 100%; }
      }
    </style>
  </head>

      const legend = document.querySelector("#legend");

        segment.style.background = language.color;
        bar.append(segment);

        const item = document.createElement("li");
        item.className = "language";

        legend.append(item);
      }

      const clamp = (value) => Math.max(0, Math.min(1, value));
      const ease = (value) => 1 - Math.pow(1 - clamp(value), 3);

      window.renderFrame = (progress, theme = "light") => {
        document.body.dataset.theme = theme;
        const intro = ease(progress / 0.22);
        main.style.opacity = intro;
        main.style.transform = `translateY(${10 * (1 - intro)}px)`;

        const barProgress = ease((progress - 0.06) / 0.46);
        bar.style.width = `${barProgress * 100}%`;

        [...legend.children].forEach((item, index) => {
          const itemProgress = ease((progress - 0.18 - index * 0.02) / 0.34);
          item.style.opacity = itemProgress;
          item.style.transform = `translateY(${7 * (1 - itemProgress)}px)`;
        });
      };

      if (!window.__PROFILE_CAPTURE__) {
        const startedAt = performance.now();
        const animate = (now) => {
          const progress = Math.min(1, (now - startedAt) / 1400);
          window.renderFrame(progress, matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }

<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Code behind the products</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        --canvas: #ffffff;
        --primary: #1d1d1f;
        --secondary: #6e6e73;
        --hairline: rgba(0, 0, 0, 0.09);
        --icon-surface: rgba(0, 0, 0, 0.04);
        background: var(--canvas);
        color: var(--primary);
      }

      body[data-theme="dark"] {
        --canvas: #0d1117;
        --primary: #f5f5f7;
        --secondary: #8e8e93;
        --hairline: rgba(255, 255, 255, 0.12);
        --icon-surface: rgba(255, 255, 255, 0.07);
      }

      main {
        width: 1920px;
        height: 720px;
        padding: 42px 56px 28px;
        opacity: 0;
        transform: translateY(10px);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 34px;
      }

      h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 640;
        letter-spacing: -3.6px;
        line-height: 1;
      }

      .summary {
        display: flex;
        gap: 52px;
      }

      .metric {
        display: grid;
        grid-template-columns: 38px auto;
        grid-template-rows: auto auto;
        column-gap: 12px;
        align-items: center;
      }

      .metric-icon {
        display: grid;
        grid-row: 1 / 3;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--icon-surface);
        color: var(--secondary);
      }

      .metric-icon svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .metric strong {
        font-size: 30px;
        font-weight: 620;
        letter-spacing: -1px;
        line-height: 1;
      }

      .metric-label,
      .updated {
        color: var(--secondary);
        font-size: 16px;
        font-weight: 450;
        letter-spacing: -0.1px;
      }

      .bar-shell {
        height: 24px;
        overflow: hidden;
        border-radius: 12px;
        background: var(--hairline);
      }

      .bar {
        display: flex;
        width: 0;
        height: 100%;
        overflow: hidden;
        border-radius: inherit;
      }

      .bar span { flex: none; height: 100%; }

      .legend {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-flow: column;
        grid-template-rows: repeat(5, 1fr);
        column-gap: 58px;
        height: 430px;
        margin: 26px 0 0;
        padding: 0;
        list-style: none;
      }

      .language {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: center;
        gap: 9px;
        min-width: 0;
        border-bottom: 1px solid var(--hairline);
        opacity: 0;
        transform: translateY(7px);
      }

      .language:nth-child(5n) { border-bottom: 0; }

      .language-icon {
        display: block;
        width: 22px;
        height: 22px;
        object-fit: contain;
      }

      .name {
        overflow: hidden;
        font-size: 18px;
        font-weight: 540;
        letter-spacing: -0.2px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .percentage {
        color: var(--secondary);
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.15px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
      }

      .updated { margin: 0; }

      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #30d158;
        box-shadow: 0 0 0 5px rgba(48, 209, 88, 0.12);
      }

      @media (prefers-reduced-motion: reduce) {
        main, .language { opacity: 1; transform: none; }
        .bar { width: 100%; }
      }
    </style>
  </head>
  <body>

      const bar = document.querySelector("#bar");
      const legend = document.querySelector("#legend");

      document.querySelector("#repository-count").textContent = profile.repositoryCount;
      document.querySelector("#language-count").textContent = profile.languages.length;
      document.querySelector("#updated").textContent = `Languages measured across ${profile.languageRepositoryCount} original repositories · ${profile.updatedLabel}`;

      for (const language of profile.languages) {
        const segment = document.createElement("span");
        segment.style.width = `${language.percentage}%`;
        segment.style.background = language.color;
        bar.append(segment);

        const item = document.createElement("li");
        item.className = "language";
        item.innerHTML = `<img class="language-icon" src="${language.icon}" alt="" /><span class="name">${language.name}</span><span class="percentage">${language.label}</span>`;
        legend.append(item);
      }

      const clamp = (value) => Math.max(0, Math.min(1, value));
      const ease = (value) => 1 - Math.pow(1 - clamp(value), 3);

      window.renderFrame = (progress, theme = "light") => {
        document.body.dataset.theme = theme;
        const intro = ease(progress / 0.22);
        main.style.opacity = intro;
        main.style.transform = `translateY(${10 * (1 - intro)}px)`;

        const barProgress = ease((progress - 0.06) / 0.46);
        bar.style.width = `${barProgress * 100}%`;

        [...legend.children].forEach((item, index) => {
          const itemProgress = ease((progress - 0.18 - index * 0.02) / 0.34);
          item.style.opacity = itemProgress;
          item.style.transform = `translateY(${7 * (1 - itemProgress)}px)`;
        });
      };

      if (!window.__PROFILE_CAPTURE__) {
        const startedAt = performance.now();
        const animate = (now) => {
          const progress = Math.min(1, (now - startedAt) / 1400);
          window.renderFrame(progress, matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }

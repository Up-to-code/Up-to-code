<svg xmlns="http://www.w3.org/2000/svg" width="720" height="52" viewBox="0 0 720 52" role="img" aria-label="Hey, I am Ahmed">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 600;
      fill: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
    }
  </style>
  <text class="title" x="0" y="36">Hey, I am Ahmed
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" />
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
<title id="title">A hand waving hello</title>
<style>
.hand { transform-origin: 32px 49px; animation: wave 2.4s ease-in-out 2; }
@keyframes wave { 0%,60%,100% { transform:rotate(0deg) } 10%,30% { transform:rotate(16deg) } 20%,40% { transform:rotate(-12deg) } 50% { transform:rotate(8deg) } }
@media (prefers-reduced-motion: reduce) { .hand { animation:none } }
</style>
